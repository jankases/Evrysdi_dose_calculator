<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Dose Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 400px; margin: 0 auto; }
        .container { background-color: #f9f9f9; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        .result { margin-top: 20px; font-weight: bold; font-size: 18px; color: #333; text-align: center; }
        .disclaimer { margin-top: 20px; font-size: 12px; color: #d9534f; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align: center;">Dose Calculator</h2>
    
    <label for="age">อายุ (ปี):</label>
    <input type="number" id="age" placeholder="เช่น 35">

    <label for="weight">น้ำหนัก (กิโลกรัม):</label>
    <input type="number" id="weight" placeholder="เช่น 60">

    <button onclick="calculateDose()">คำนวณปริมาณยา</button>

    <div class="result" id="resultText"></div>

    <div class="disclaimer">
        *For Healthcare Professionals Only. This tool is for informational purposes and does not replace professional clinical judgment.
    </div>
</div>

<script>
    function calculateDose() {
        // ดึงค่าจากช่องกรอก
        let age = document.getElementById("age").value;
        let weight = document.getElementById("weight").value;

        // เช็คว่ากรอกข้อมูลครบไหม
        if(age === "" || weight === "") {
            document.getElementById("resultText").innerText = "กรุณากรอกอายุและน้ำหนักให้ครบถ้วน";
            return;
        }

        // ตัวอย่างสูตรคำนวณ (คุณสามารถเปลี่ยนสูตรตรงนี้ได้เลย)
        // สมมติ: ปริมาณยา = น้ำหนัก * 2.5 mg
        let dose = weight * 2.5;

        // แสดงผล
        document.getElementById("resultText").innerText = "ปริมาณแนะนำ: " + dose + " mg";
    }
</script>

</body>
</html>
